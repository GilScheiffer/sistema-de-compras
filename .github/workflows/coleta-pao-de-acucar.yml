name: Coleta Pão de Açúcar

on:
  schedule:
    - cron: "0 9 * * *"  # 06:00 em Brasília
  workflow_dispatch:

concurrency:
  group: coleta-pao-de-acucar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: python -m compras.coletar pao_de_acucar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
