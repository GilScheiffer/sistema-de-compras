# Catálogo de itens genéricos (o que aparece no onboarding).
#
# busca:   o que o robô digita na busca da loja
# incluir: TODOS os termos precisam aparecer no nome do produto ("a|b" = a OU b)
# excluir: NENHUM desses termos pode aparecer
# Os termos são comparados sem acento e como palavras inteiras.
