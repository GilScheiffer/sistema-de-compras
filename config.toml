# Configuração das lojas e regras de preço.
# Valores de frete são estimativas: confiram e ajustem com a realidade de vocês.

[geral]
banco = "dados/compras.db"

# Condições que vocês atendem. As regras e fretes abaixo consultam essas chaves.
[perfil]
cartao_pao_de_acucar = true
amazon_prime = false

[lojas.guanabara]
nome = "Guanabara"
tipo = "fisica"
custo_visita = 0.0   # gasolina/uber/tempo para ir até lá, se quiserem considerar

[lojas.pao_de_acucar]
nome = "Pão de Açúcar"
tipo = "fisica"
custo_visita = 0.0

[[lojas.pao_de_acucar.regras]]
tipo = "desconto_marca"
marca = "Qualitá"
percentual = 20
condicao = "cartao_pao_de_acucar"

[lojas.amazon]
nome = "Amazon"
tipo = "online"
frete = 20.0
frete_gratis_acima = 100.0
frete_isento_se = "amazon_prime"

[lojas.mercado_livre]
nome = "Mercado Livre"
tipo = "online"
frete = 20.0
frete_gratis_acima = 79.0

[lojas.shopee]
nome = "Shopee"
tipo = "online"
frete = 15.0
frete_gratis_acima = 50.0
