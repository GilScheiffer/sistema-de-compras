[project]
name = "compras"
version = "0.1.0"
description = "Robôs de coleta de preços de mercado da casa"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["compras*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
